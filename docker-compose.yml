# Local helpers only. WordPress itself stays a normal install.
# The model runner is expected on the host at 127.0.0.1:11434.

services:
  middleware:
    image: python:3.12-slim
    working_dir: /app/middleware
    command: python -m satira.app
    volumes:
      - ./:/app
    env_file:
      - .env
    ports:
      - "127.0.0.1:8787:8787"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
